name: dependabot-auto-merge

# Let Dependabot's minor and patch updates merge themselves once CI is green,
# so the maintainer only reviews major bumps. Requires "Allow auto-merge" on the
# repo (enabled) and passing required checks. If main requires an approving
# review, auto-merge waits for one; drop the required review count to let these
# merge unattended.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
      - name: Enable auto-merge for minor and patch updates
        if: ${{ steps.meta.outputs.update-type != 'version-update:semver-major' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
